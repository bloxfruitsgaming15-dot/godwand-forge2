// build.gradle — forgegradle 6, forge 1.20.1-47.2.0, java 17, official (mojang) mappings
plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.eightcord'
version = '1.0.0'
base { archivesName = 'godwand' }

java { withSourcesJar() }
tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
